<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Devis Vocal — Formulaire</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main>
    <header>
      <h1>Devis Vocal — Formulaire</h1>
      <p class="sub">Remplissez chaque champ à la voix ou au clavier.</p>
    </header>

    <form id="devis-form" class="devis-form" autocomplete="off">

      <!-- ========== CLIENT ========== -->
      <section class="form-block" data-champ="client">
        <label class="form-block-label" for="champ-client">Client</label>
        <div class="input-row">
          <input id="champ-client" class="form-input champ-input"
                 type="text" placeholder="Nom du client…" />
          <button class="mic-btn mic-small idle" type="button"
                  data-target="client" aria-label="Dicter le client">
            <svg class="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="2" width="6" height="12" rx="3"></rect>
              <path d="M5 10a7 7 0 0 0 14 0"></path>
              <line x1="12" y1="19" x2="12" y2="23"></line>
              <line x1="8" y1="23" x2="16" y2="23"></line>
            </svg>
          </button>
        </div>
        <p class="mic-status" data-status="client"></p>
        <div id="client-db-content" class="client-db-content"></div>
      </section>

      <!-- ========== CATÉGORIE ========== -->
      <section class="form-block" data-champ="categorie">
        <label class="form-block-label" for="champ-categorie">Catégorie</label>
        <div class="input-row">
          <input id="champ-categorie" class="form-input champ-input"
                 type="text" placeholder="Carrelage, plomberie, peinture…" />
          <button class="mic-btn mic-small idle" type="button"
                  data-target="categorie" aria-label="Dicter la catégorie">
            <svg class="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="2" width="6" height="12" rx="3"></rect>
              <path d="M5 10a7 7 0 0 0 14 0"></path>
              <line x1="12" y1="19" x2="12" y2="23"></line>
              <line x1="8" y1="23" x2="16" y2="23"></line>
            </svg>
          </button>
        </div>
        <p class="mic-status" data-status="categorie"></p>
      </section>

      <!-- ========== FOURNITURES ========== -->
      <section class="form-block" data-champ="fourniture">
        <div class="fournitures-header">
          <span class="form-block-label">Fournitures</span>
          <div class="fournitures-actions">
            <button type="button" id="btn-add-fourniture"
                    class="btn-add" aria-label="Ajouter une ligne vide">+</button>
            <button class="mic-btn mic-small idle" type="button"
                    data-target="fourniture" aria-label="Dicter une fourniture">
              <svg class="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="2" width="6" height="12" rx="3"></rect>
                <path d="M5 10a7 7 0 0 0 14 0"></path>
                <line x1="12" y1="19" x2="12" y2="23"></line>
                <line x1="8" y1="23" x2="16" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>
        <p class="mic-status" data-status="fourniture"></p>
        <div id="fournitures-list" class="fournitures-list">
          <p class="fournitures-empty">Aucune fourniture — dictez-en une ou cliquez sur +</p>
        </div>
      </section>

      <div class="form-footer">
        <button type="submit" class="form-submit">Valider le devis</button>
      </div>
    </form>

    <details id="debug" class="debug hidden">
      <summary>JSON du devis (debug)</summary>
      <pre id="debug-json"></pre>
    </details>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
