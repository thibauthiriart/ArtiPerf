<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Devis Vocal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main>
    <header>
      <h1>Devis Vocal</h1>
      <p class="sub">Dictez votre devis, l'assistant extrait les informations.</p>
    </header>

    <section class="record">
      <button id="btn" class="mic-btn idle" type="button" aria-label="Enregistrer">
        <svg class="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="2" width="6" height="12" rx="3"></rect>
          <path d="M5 10a7 7 0 0 0 14 0"></path>
          <line x1="12" y1="19" x2="12" y2="23"></line>
          <line x1="8" y1="23" x2="16" y2="23"></line>
        </svg>
      </button>
      <p id="timer" class="timer" aria-live="polite"></p>
      <p id="status" class="status" aria-live="polite">Cliquez sur le micro pour démarrer</p>
    </section>

    <section id="transcript" class="panel hidden">
      <h2>Transcription</h2>
      <p id="transcript-text"></p>
    </section>

    <div class="results-row">
      <section id="devis" class="panel hidden">
        <h2>Devis extrait</h2>

        <div class="field">
          <span class="label">Client dicté</span>
          <span id="devis-client" class="value"></span>
        </div>

        <div class="field">
          <span class="label">Domaine</span>
          <span id="devis-domaine" class="value"></span>
        </div>

        <div id="devis-address-field" class="field hidden">
          <span class="label">Adresse</span>
          <span id="devis-address" class="value value-address"></span>
        </div>

        <div id="devis-phone-field" class="field hidden">
          <span class="label">Téléphone</span>
          <span id="devis-phone" class="value"></span>
        </div>

        <div class="fournitures">
          <span class="label">Fournitures</span>
          <div id="devis-fournitures"></div>
        </div>
      </section>

      <section id="client-db" class="panel hidden">
        <h2>Fiche client</h2>
        <div id="client-db-content"></div>
      </section>
    </div>

    <section id="message" class="panel hidden">
      <h2>Message</h2>
      <p id="message-text"></p>
    </section>

    <details id="debug" class="debug hidden">
      <summary>JSON brut (debug)</summary>
      <pre id="debug-json"></pre>
    </details>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
